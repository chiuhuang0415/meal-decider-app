<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>靈感美饌決策助手 Pro</title>
    <meta name="description" content="專為手機端打造的極速飲食決策工具。一鍵拉霸決策、解決選擇障礙。">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=3.0.0">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- 頂部精簡 Header -->
    <header class="app-header">
        <div class="logo">
            <span class="icon">🍱</span>
            <div class="logo-text">
                <h1>靈感美饌決策助手</h1>
                <p>Mobile App Mode • 秒定今日美味</p>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- 頁籤一：手機拉霸卡片抽籤 -->
        <section id="slot-sec" class="tab-content active">
            <div class="card glass slot-card">
                <div class="slot-tag" id="slotCategoryTag">✨ 今日美味提案</div>
                <div class="slot-window">
                    <div id="slotText" class="slot-text">🎲 點擊下方按鈕</div>
                </div>
                <p id="slotReasonText" class="slot-reason">「放空大腦，讓命運為你選擇最佳美味！」</p>

                <div class="slot-action-area">
                    <button id="slotSpinBtn" class="hero-spin-btn">
                        <span class="btn-icon">🎰</span>
                        <span class="btn-text">幫我決定今天吃什麼！</span>
                    </button>

                    <div class="secondary-actions">
                        <button id="slotBlindBtn" class="sub-btn">🎁 驚喜盲盒</button>
                        <button id="slotMapBtn" class="sub-btn map-btn hidden">📍 尋找附近店家</button>
                    </div>
                </div>
            </div>

            <!-- 情境快篩 -->
            <div class="card glass mobile-filter-card">
                <div class="filter-header" id="toggleFilterBtn">
                    <span>🎛️ 智慧情境篩選 (點擊展開)</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="filter-body hidden" id="filterBody">
                    <div class="filter-group">
                        <label>餐別時間</label>
                        <div class="chip-group" data-filter="mealType">
                            <button class="chip active" data-val="all">全部</button>
                            <button class="chip" data-val="lunch">🌞 午餐</button>
                            <button class="chip" data-val="dinner">🌙 晚餐</button>
                        </div>
                    </div>
                    <div class="filter-group">
                        <label>美食類別</label>
                        <div class="chip-group" data-filter="category">
                            <button class="chip active" data-val="all">不限</button>
                            <button class="chip" data-val="rice">🍚 米飯</button>
                            <button class="chip" data-val="noodle">🍜 麵食</button>
                            <button class="chip" data-val="light">🥗 清爽</button>
                            <button class="chip" data-val="fast">🍔 快餐</button>
                            <button class="chip" data-val="exotic">🍕 異國</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 頁籤二：一週菜單規劃 -->
        <section id="weekly-sec" class="tab-content">
            <div class="card glass weekly-card">
                <h2>🗓️ 一週飲食備忘錄</h2>
                <button id="genWeeklyBtn" class="btn-primary" style="width: 100%; margin: 0.8rem 0;">✨ 一鍵生成全週菜單</button>
                <div class="weekly-grid" id="weeklyGrid"></div>
            </div>
        </section>

        <!-- 頁籤三：美饌自訂庫管理 -->
        <section id="manage-sec" class="tab-content">
            <div class="card glass manage-card">
                <h2>⚙️ 我的口袋名單 (<span id="foodCount">0</span>)</h2>
                <form id="addFoodForm" class="add-food-form">
                    <input type="text" id="foodName" placeholder="店家/菜色名稱" required class="form-input">
                    <select id="foodCategory" class="form-select">
                        <option value="rice">🍚 米飯</option>
                        <option value="noodle">🍜 麵食</option>
                        <option value="light">🥗 清爽</option>
                        <option value="fast">🍔 快餐</option>
                        <option value="exotic">🍕 異國</option>
                    </select>
                    <button type="submit" class="btn-success">+ 新增至名單</button>
                </form>
                <div id="foodList" class="food-chip-list"></div>
            </div>
        </section>
    </main>

    <!-- 固定於手機底部的全域導覽列 -->
    <nav class="bottom-nav">
        <button class="bottom-tab active" data-tab="slot-sec">
            <span class="icon">🎲</span>
            <span class="label">今日決策</span>
        </button>
        <button class="bottom-tab" data-tab="weekly-sec">
            <span class="icon">🗓️</span>
            <span class="label">一週菜單</span>
        </button>
        <button class="bottom-tab" data-tab="manage-sec">
            <span class="icon">⚙️</span>
            <span class="label">美食庫</span>
        </button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="app.js?v=3.0.0"></script>
</body>
</html>
