<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>靈感美饌決策助手 | 徹底解放你的吃什麼選擇疲勞</title>
    <meta name="description" content="專為解決每日飲食選擇困難症打造的智慧決策工具。包含美觀轉盤抽籤、情境智慧篩選與一整週菜單自動規劃器。">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <header class="app-header">
        <div class="logo">
            <span class="icon">🍱</span>
            <div class="logo-text">
                <h1>靈感美饌決策助手</h1>
                <p>Meal Decider Pro • 擺脫選擇障礙，解放腦力</p>
            </div>
        </div>
        <nav class="nav-tabs">
            <button class="tab-btn active" data-tab="wheel-sec">🎯 幸運決策輪盤</button>
            <button class="tab-btn" data-tab="weekly-sec">🗓️ 一週菜單預約</button>
            <button class="tab-btn" data-tab="manage-sec">⚙️ 我的美食庫</button>
        </nav>
    </header>

    <main class="container">
        <!-- 頁籤一：輪盤抽籤 -->
        <section id="wheel-sec" class="tab-content active">
            <div class="grid-2col">
                <!-- 左側：轉盤控制與可視化 -->
                <div class="card glass wheel-card">
                    <div class="wheel-header">
                        <h2>今天吃什麼？</h2>
                        <p class="subtitle">放空大腦，讓命運指引今日美味</p>
                    </div>

                    <div class="wheel-wrapper">
                        <div class="pointer">▼</div>
                        <canvas id="wheelCanvas" width="420" height="420"></canvas>
                        <button id="spinBtn" class="spin-center-btn">SPIN!</button>
                    </div>

                    <div class="action-bar">
                        <button id="quickSpinBtn" class="btn btn-primary pulse">⚡ 極速隨機抽籤</button>
                        <button id="blindBoxBtn" class="btn btn-secondary">🎁 驚喜美食盲盒</button>
                    </div>
                </div>

                <!-- 右側：篩選條件與結果展示 -->
                <div class="card glass right-panel">
                    <!-- 隨機結果展示盒 -->
                    <div id="resultBox" class="result-box hidden">
                        <div class="result-badge">今日首選</div>
                        <h3 id="resultTitle">日式拉麵</h3>
                        <p id="resultTags" class="result-tags">
                            <span class="tag">午餐/晚餐</span>
                            <span class="tag">熱騰騰</span>
                        </p>
                        <p id="resultReason" class="result-reason">「濃郁湯頭與彈牙麵條，能為忙碌的一天帶來滿滿療癒感！」</p>
                        <div class="result-actions">
                            <button id="acceptBtn" class="btn btn-success">✅ 就吃這個！(標記已選)</button>
                            <button id="retryBtn" class="btn btn-outline">🔄 換一個</button>
                        </div>
                        <div class="result-online-actions" style="margin-top: 1rem; display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap;">
                            <button id="searchMapBtn" class="btn btn-primary" style="font-size: 0.85rem; padding: 0.6rem 1rem;">📍 尋找附近店家 (Google Maps)</button>
                            <button id="searchUberBtn" class="btn btn-secondary" style="font-size: 0.85rem; padding: 0.6rem 1rem;">🛵 尋找外送平台</button>
                        </div>
                    </div>

                    <!-- 篩選條件設定 -->
                    <div class="filter-section">
                        <h3><span class="icon font-icon">🎛️</span> 智慧情境篩選</h3>
                        <p class="filter-hint">根據現在的心情或狀態收窄選項：</p>
                        
                        <div class="filter-group">
                            <label>餐別時間</label>
                            <div class="chip-group" data-filter="mealType">
                                <button class="chip active" data-val="all">全部</button>
                                <button class="chip" data-val="lunch">午餐輕鬆吃</button>
                                <button class="chip" data-val="dinner">晚餐豐盛吃</button>
                            </div>
                        </div>

                        <div class="filter-group">
                            <label>想走的風格</label>
                            <div class="chip-group" data-filter="category">
                                <button class="chip active" data-val="all">不限</button>
                                <button class="chip" data-val="rice">飯食米飯</button>
                                <button class="chip" data-val="noodle">麵食粉類</button>
                                <button class="chip" data-val="light">清爽健康/沙拉</button>
                                <button class="chip" data-val="fast">快餐/漢堡/炸雞</button>
                                <button class="chip" data-val="exotic">異國料理</button>
                            </div>
                        </div>

                        <div class="filter-group">
                            <label>距離與速度</label>
                            <div class="chip-group" data-filter="speed">
                                <button class="chip active" data-val="all">不限</button>
                                <button class="chip" data-val="quick">10分鐘搞定</button>
                                <button class="chip" data-val="sit">可坐下慢慢享用</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 頁籤二：一週菜單規劃 -->
        <section id="weekly-sec" class="tab-content">
            <div class="card glass weekly-card">
                <div class="weekly-header">
                    <div>
                        <h2>🗓️ 一週美食備忘錄</h2>
                        <p class="subtitle">週日一次排好全週飲食，週一到週五徹底零負擔！</p>
                    </div>
                    <div class="weekly-header-actions">
                        <button id="genWeeklyBtn" class="btn btn-primary">✨ 智慧一鍵生成全週菜單</button>
                        <button id="copyWeeklyBtn" class="btn btn-outline">📋 複製文字菜單</button>
                    </div>
                </div>

                <div class="weekly-grid" id="weeklyGrid">
                    <!-- JS 動態渲染 7 天的午晚餐卡片 -->
                </div>
            </div>
        </section>

        <!-- 頁籤三：美饌自訂庫管理 -->
        <section id="manage-sec" class="tab-content">
            <div class="card glass manage-card">
                <div class="manage-header">
                    <h2>⚙️ 個人美食清單管理</h2>
                    <p class="subtitle">新增你家附近的私房店家或最愛菜色，客製化你的決策資料庫</p>
                </div>

                <form id="addFoodForm" class="add-food-form">
                    <input type="text" id="foodName" placeholder="菜色或店家名稱 (例如: 阿財牛肉麵)" required class="form-input">
                    <select id="foodCategory" class="form-select">
                        <option value="rice">🍚 飯食米飯</option>
                        <option value="noodle">🍜 麵食粉類</option>
                        <option value="light">🥗 清爽健康</option>
                        <option value="fast">🍔 快餐漢堡</option>
                        <option value="exotic">🍕 異國料理</option>
                    </select>
                    <select id="foodMealType" class="form-select">
                        <option value="all">🌞&🌙 午晚餐皆宜</option>
                        <option value="lunch">🌞 午餐限定</option>
                        <option value="dinner">🌙 晚餐限定</option>
                    </select>
                    <button type="submit" class="btn btn-success">+ 新增至口袋名單</button>
                </form>

                <div class="food-list-container">
                    <h3>現有口袋名單 (<span id="foodCount">0</span>)</h3>
                    <div id="foodList" class="food-chip-list">
                        <!-- 動態印出美食標籤 -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <p>© 2026 靈感美饌決策助手 Pro • 讓大腦休息，給生活加點美味靈感</p>
    </footer>

    <!-- Confetti JS for winning celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
